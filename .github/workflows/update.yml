# 매주 토요일 추첨 후 새 회차를 받아 data/ 를 갱신하고 GitHub Pages 에 배포한다.
# 파일을 올리거나 수정해도(push) 바로 다시 배포된다. Actions 탭에서 수동 실행도 가능.
name: 로또 데이터 갱신 및 배포

on:
  schedule:
    - cron: '30 13 * * 6'  # 토 22:30 (한국시간) - 추첨 직후
    - cron: '0 0 * * 0'    # 일 09:00 (한국시간) - 토요일에 실패했을 때 재시도
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 새 회차 가져오기
        if: github.event_name != 'push'
        shell: pwsh
        run: ./scripts/update.ps1

      - name: 명당(1등 판매점) 데이터 갱신
        if: github.event_name != 'push'
        shell: pwsh
        run: ./scripts/stores.ps1

      - name: 바뀐 데이터 저장(커밋)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새 회차 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
